<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#d62d20" />
    <title>Offline | Dhungel Dex</title>
    <style>
      :root {
        --bg-cream: #f4e9d8;
        --ink: #1f2937;
        --accent: #d62d20;
        --panel: #fff8ee;
        --line: #2f2f2f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 15% 20%, #ffe7cc 0%, transparent 35%),
          radial-gradient(circle at 85% 80%, #ffd2c4 0%, transparent 32%),
          linear-gradient(135deg, #fdf5e8, var(--bg-cream));
        padding: 24px;
      }
      .card {
        width: min(640px, 100%);
        border: 4px solid var(--line);
        border-radius: 16px;
        background: var(--panel);
        box-shadow: 0 12px 0 rgba(0, 0, 0, 0.08);
        overflow: hidden;
      }
      .titlebar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 18px;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
      }
      .status {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #ffd966;
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.25);
      }
      .content {
        padding: 22px 20px 24px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.2rem, 2.8vw, 1.7rem);
      }
      p {
        margin: 0 0 12px;
        line-height: 1.5;
      }
      .tip {
        margin-top: 14px;
        padding: 10px 12px;
        border: 2px dashed var(--line);
        border-radius: 10px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <main class="card" role="main" aria-live="polite">
      <div class="titlebar">
        <span>Dhungel Dex</span>
        <span class="status" aria-hidden="true"></span>
      </div>
      <div class="content">
        <h1>You are offline</h1>
        <p>
          This app shell is available without internet. Reconnect to load the latest pages and updates.
        </p>
        <p class="tip">Tip: Installed PWAs open like native apps and can keep using cached content offline.</p>
      </div>
    </main>
  </body>
</html>
